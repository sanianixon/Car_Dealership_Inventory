name: CI

# Runs both suites on every push and pull request, so the tests are shown to
# pass somewhere other than the machine they were written on.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests with coverage
        run: pytest -v --cov=app --cov-report=term-missing

      - name: Check the seed script is idempotent
        # Two runs in a row must add 14 vehicles and then none. A seed script
        # that duplicates its data on a second run is a common and quiet bug.
        run: |
          python scripts/seed.py
          python scripts/seed.py | tee second-run.txt
          grep -q "vehicles added: 0" second-run.txt
        env:
          DATABASE_URL: sqlite:///./ci.db

  frontend:
    name: Frontend (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build

      - name: Run tests
        run: npm test
