name: CI

# Runs both suites on every push and pull request, so the tests are shown to
# pass somewhere other than the machine they were written on.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests with coverage
        run: pytest -v --cov=app --cov-report=term-missing

      - name: Smoke-test the seed script
        # Idempotency is asserted in tests/test_seed.py, against behaviour
        # rather than against printed wording. This only checks the script runs
        # end to end against a real database file, which the tests do not do.
        run: python scripts/seed.py
        env:
          DATABASE_URL: sqlite:///./ci.db

  frontend:
    name: Frontend (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build

      - name: Run tests
        run: npm test
